name: Build and publish APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK platform and tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'

      - name: Test and build release APK
        # SDK 22 is intentional; this sideloaded app is not a Play Store submission.
        run: ./gradlew --no-daemon testDebugUnitTest :app:packageRelease

      - name: Sign and verify APK
        env:
          ICONGEN_KEYSTORE_BASE64: ${{ secrets.ICONGEN_KEYSTORE_BASE64 }}
          ICONGEN_KEYSTORE_PASSWORD: ${{ secrets.ICONGEN_KEYSTORE_PASSWORD }}
          ICONGEN_KEY_PASSWORD: ${{ secrets.ICONGEN_KEY_PASSWORD }}
          ICONGEN_KEY_ALIAS: ${{ vars.ICONGEN_KEY_ALIAS }}
        run: |
          umask 077
          test -n "$ICONGEN_KEYSTORE_BASE64"
          test -n "$ICONGEN_KEYSTORE_PASSWORD"
          test -n "$ICONGEN_KEY_PASSWORD"
          test -n "$ICONGEN_KEY_ALIAS"
          keystore="$RUNNER_TEMP/icongen-release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ICONGEN_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign \
            --ks "$keystore" \
            --ks-key-alias "$ICONGEN_KEY_ALIAS" \
            --ks-pass env:ICONGEN_KEYSTORE_PASSWORD \
            --key-pass env:ICONGEN_KEY_PASSWORD \
            --out "$RUNNER_TEMP/IconGen.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$signer" verify --verbose --print-certs "$RUNNER_TEMP/IconGen.apk"

      - name: Upload commit APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: IconGen-${{ github.sha }}
          path: ${{ runner.temp }}/IconGen.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Publish commit prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-$GITHUB_SHA"
          apk="$RUNNER_TEMP/IconGen.apk"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "IconGen ${GITHUB_SHA:0:7}" \
              --prerelease \
              --latest=false \
              --notes "Signed APK for commit [$GITHUB_SHA](https://github.com/$GH_REPO/commit/$GITHUB_SHA). See the [README](https://github.com/$GH_REPO/blob/$GITHUB_SHA/README.md) for installation and setup."
          fi
